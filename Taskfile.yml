version: '3'
vars:
  PRESET: '{{default "dev" .PRESET}}'
  BUILD_DIR: build/{{.PRESET}}
  SYSTEM_BUILD_DIR: build/release
  LIVE_ROOT: /tmp/holonight-greeter-live
  PROVIDER_PREFIX: '{{default "/usr" .PROVIDER_PREFIX}}'
tasks:
  license-check:
    desc: Validate REUSE licensing metadata
    cmds:
    - reuse lint
  build:system:
    deps:
    - configure:system
    cmds:
    - cmake --build {{.SYSTEM_BUILD_DIR}}
  install:system:
    desc: Install the production greeter and provision its state directory
    deps:
    - build:system
    cmds:
    - sudo cmake --install {{.SYSTEM_BUILD_DIR}}
    - sudo systemd-tmpfiles --create holonight-greeter.conf
  troubleshoot:
    desc: Review greetd, Cage coredumps, and service state after a login cycle
    cmds:
    - journalctl -b -u greetd --since '-10 minutes' --no-pager
    - cmd: coredumpctl list cage --since '-10 minutes' --no-pager
      ignore_error: true
    - cmd: systemctl status greetd --no-pager
      ignore_error: true
  live:test:
    desc: Build and run an isolated greetd greeter on VT2
    preconditions:
    - sh: test ! -e /run/greetd-holonight-live.sock
      msg: /run/greetd-holonight-live.sock already exists; verify that no live test is running
    cmds:
    - task: configure:release
    - cmake --build build/release
    - DESTDIR={{.LIVE_ROOT}}/root cmake --install build/release
    - install -m 0644 deploy/greetd-live.toml {{.LIVE_ROOT}}/greetd-live.toml
    - sudo install -d -o greeter -g greeter -m 0700 {{.LIVE_ROOT}}/state
    - bash scripts/run-live-test.sh
  runtime-launches:
    deps:
    - build
    cmds:
    - python3 scripts/check-runtime-launches.py {{.BUILD_DIR}}/holonight-greeter {{.PROVIDER_PREFIX}} --logs {{.BUILD_DIR}}/launch-build
  caret-graphics:
    desc: Compare caret pixels on isolated headless Sway with prepared providers
    cmds:
    - task: build
      vars:
        PRESET: dev
    - python3 scripts/check-caret-graphics.py build/dev/greeter_runtime_tests "{{.PROVIDER_PREFIX}}" --logs build/dev/caret-graphics
  qml-import-check:
    desc: Check QML runtime import contracts
    cmds:
    - bash scripts/check-runtime-qml-imports.sh .
  qml-lint:
    desc: qml-lint
    cmds:
    - cmake --build build/{{.PRESET}} --target qml-lint
  check:
    desc: Authoritative container acceptance
    cmds:
    - python3 scripts/ci/container.py check {{.CLI_ARGS}}
  configure:
    desc: configure
    cmds:
    - cmake --preset {{.PRESET}} {{.CLI_ARGS}}
  build:
    desc: build
    cmds:
    - cmake --preset {{.PRESET}}
    - cmake --build --preset {{.PRESET}}
  test:
    desc: test
    cmds:
    - task: build
      vars:
        PRESET: dev
    - dbus-run-session -- ctest --preset dev {{.CLI_ARGS}}
  configure:release:
    desc: configure:release
    cmds:
    - cmake --preset release {{.CLI_ARGS}}
  build:release:
    desc: build:release
    cmds:
    - cmake --preset release
    - cmake --build --preset release
  format:
    desc: Format with the pinned container tools
    cmds:
    - python3 scripts/ci/container.py format
  format-check:
    desc: format-check
    cmds:
    - python3 scripts/quality.py format-check
  tidy:
    desc: tidy
    cmds:
    - python3 scripts/quality.py tidy --build build/{{.PRESET}}
  check:integration:
    desc: Container acceptance plus Release staging and runtime checks
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
  qmltypes-check:
    desc: qmltypes-check
    cmds:
    - python3 scripts/quality.py qmltypes --build build/{{.PRESET}} --module Holonight.Greeter
  configure:system:
    desc: Configure the production greeter
    cmds:
    - cmake --preset release
