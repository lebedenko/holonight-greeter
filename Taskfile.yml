version: '3'
vars:
  BUILD_DIR: 'build/{{.PRESET}}'
  HOLONIGHT_QT_PREFIX: '{{default (printf "%s/build/deps/prefix" .TASKFILE_DIR) .HOLONIGHT_DEPENDENCY_PREFIX}}'
  NPROC: 4
  SYSTEM_BUILD_DIR: build/release
  LIVE_ROOT: /tmp/holonight-greeter-live
  PRESET: '{{default "debug" .PRESET}}'
tasks:
  ci:
    desc: Rehearse push validation in pinned isolated containers
    cmds:
    - python3 scripts/ci/run.py
  license-check:
    desc: Validate REUSE licensing metadata
    cmds:
    - reuse lint
  ci:prepare:
    desc: Explicitly acquire pinned images and exact provider sources, then run task deps
    cmds:
    - python3 scripts/ci/run.py --prepare
  configure:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset {{.PRESET}}
  build:
    desc: build using standalone tooling
    cmds:
    - python3 tooling/workflow.py build --preset {{.PRESET}}
  configure:system:
    cmds:
    - python3 tooling/workflow.py configure --preset release
  build:system:
    deps:
    - configure:system
    cmds:
    - cmake --build {{.SYSTEM_BUILD_DIR}}
  install:system:
    desc: Install the production greeter and provision its state directory
    deps:
    - build:system
    cmds:
    - sudo cmake --install {{.SYSTEM_BUILD_DIR}}
    - sudo systemd-tmpfiles --create holonight-greeter.conf
  troubleshoot:
    desc: Review greetd, Cage coredumps, and service state after a login cycle
    cmds:
    - journalctl -b -u greetd --since '-10 minutes' --no-pager
    - cmd: coredumpctl list cage --since '-10 minutes' --no-pager
      ignore_error: true
    - cmd: systemctl status greetd --no-pager
      ignore_error: true
  live:test:
    desc: Build and run an isolated greetd greeter on VT2
    preconditions:
    - sh: test ! -e /run/greetd-holonight-live.sock
      msg: /run/greetd-holonight-live.sock already exists; verify that no live test is running
    cmds:
    - task: configure:release
    - cmake --build build/release
    - DESTDIR={{.LIVE_ROOT}}/root cmake --install build/release
    - install -m 0644 deploy/greetd-live.toml {{.LIVE_ROOT}}/greetd-live.toml
    - sudo install -d -o greeter -g greeter -m 0700 {{.LIVE_ROOT}}/state
    - bash scripts/run-live-test.sh
  test:
    desc: test using standalone tooling
    cmds:
    - python3 tooling/workflow.py test --preset {{.PRESET}}
  lint:
    deps:
    - build
    cmds:
    - task: tidy
    - cmake --build {{.BUILD_DIR}} --target format-check
    - cmake --build {{.BUILD_DIR}} --target qml-lint
    - git diff --check
  tidy:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope all
  runtime-launches:
    deps:
    - build
    cmds:
    - python3 scripts/check-runtime-launches.py {{.BUILD_DIR}}/holonight-greeter {{.HOLONIGHT_QT_PREFIX}} --logs {{.BUILD_DIR}}/launch-build
  caret-graphics:
    desc: Compare caret pixels on isolated headless Sway with prepared providers
    cmds:
    - task: build
      vars:
        PRESET: test
    - python3 scripts/check-caret-graphics.py build/test/greeter_runtime_tests "{{.HOLONIGHT_QT_PREFIX}}" --logs build/test/caret-graphics
  tooling:doctor:
    desc: doctor using standalone tooling
    cmds:
    - python3 tooling/workflow.py doctor
  tooling:refresh:
    desc: refresh using standalone tooling
    cmds:
    - python3 tooling/workflow.py refresh --preset {{default "test" .EDITOR_PRESET}}
  serena:serve:
    desc: Start independent Serena server in codex context
    cmds:
    - serena start-mcp-server --project "{{.TASKFILE_DIR}}" --context codex
  serena:index:
    desc: Explicitly index this module
    cmds:
    - serena project index "{{.TASKFILE_DIR}}"
  deps:
    desc: deps using standalone tooling
    cmds:
    - python3 tooling/workflow.py deps --preset {{.PRESET}}
  configure-tests:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset test
  configure:release:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset release
  build:release:
    desc: build using standalone tooling
    cmds:
    - python3 tooling/workflow.py build --preset release
  format:
    desc: format using standalone tooling
    cmds:
    - python3 tooling/workflow.py format
  format-check:
    desc: format-check using standalone tooling
    cmds:
    - python3 tooling/workflow.py format-check
  tidy-src:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope src
  tidy-tests:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope tests
  qml-import-check:
    desc: Check QML runtime import contracts
    cmds:
    - bash scripts/check-runtime-qml-imports.sh .
  qmltypes-check:
    desc: Build and verify generated QML metadata
    cmds:
    - task: build
      vars:
        PRESET: test
    - python3 tooling/workflow.py qmltypes-check --preset test
  qml-lint:
    desc: Build and check QML with configured Qt installation
    cmds:
    - task: build
      vars:
        PRESET: test
    - cmake --build build/test --target qml-lint
  tooling:qmlls:
    desc: Start configured Qt language server with resolved import paths
    cmds:
    - python3 tooling/workflow.py qmlls
  check:
    desc: Run build, tests and static checks
    cmds:
    - task: build
    - task: test
    - task: format-check
    - task: lint
