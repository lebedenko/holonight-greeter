name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, and stage installation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CI image
        run: docker build --file Dockerfile.ci --tag holonight-greeter-ci:local .

      - name: Checkout holonight-config dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: fe69a59e6b73167fd5349223a4d265d75386c139
          path: holonight-config-dep

      - name: Checkout holonight-qt dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: 00e6e208b6c9b30d89b66ef3aeb4ef8175050764
          path: holonight-qt-dep

      - name: Build and verify
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            holonight-greeter-ci:local \
            bash -euxo pipefail -c '
              git config --global --add safe.directory /workspace

              cmake -S holonight-config-dep -B build-ci/dependencies/config -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build build-ci/dependencies/config --parallel
              cmake --install build-ci/dependencies/config --prefix /workspace/build-ci/dependencies/prefix

              cmake -S holonight-qt-dep -B build-ci/dependencies/qt -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_DEMO=OFF -DBUILD_CONTROLS_GALLERY=OFF -DBUILD_WAYLAND=ON \
                -DCMAKE_PREFIX_PATH=/workspace/build-ci/dependencies/prefix \
                -DHoloNightConfig_DIR=/workspace/build-ci/dependencies/prefix/lib/cmake/HoloNightConfig
              cmake --build build-ci/dependencies/qt --parallel
              cmake --install build-ci/dependencies/qt --prefix /workspace/build-ci/dependencies/prefix

              cmake -S . -B build-ci -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_INSTALL_PREFIX=/usr \
                -DCMAKE_PREFIX_PATH=/workspace/build-ci/dependencies/prefix \
                -DHolonightQt_DIR=/workspace/build-ci/dependencies/prefix/lib/cmake/HolonightQt
              cmake --build build-ci --parallel
              ctest --test-dir build-ci --output-on-failure --no-tests=error
              cmake --build build-ci --target format-check
              cmake --build build-ci --target qml-lint
              python3 scripts/check-static.py build-ci
              python3 scripts/check-runtime-launches.py build-ci/holonight-greeter build-ci/dependencies/prefix --logs build-ci/launch-build
              git diff --check

              test ! -e /etc/greetd/config.toml
              DESTDIR=/tmp/holonight-greeter-stage cmake --install build-ci
              cmake --install build-ci/dependencies/config --prefix /tmp/holonight-greeter-stage/usr
              cmake --install build-ci/dependencies/qt --prefix /tmp/holonight-greeter-stage/usr
              python3 scripts/check-runtime-launches.py /tmp/holonight-greeter-stage/usr/bin/holonight-greeter /tmp/holonight-greeter-stage/usr --forbid-path /workspace/build-ci --logs build-ci/launch-installed
              test -x /tmp/holonight-greeter-stage/usr/bin/holonight-greeter
              test -x /tmp/holonight-greeter-stage/usr/bin/holonight-greeter-session
              test -f /tmp/holonight-greeter-stage/etc/holonight/greeter.toml
              test -f /tmp/holonight-greeter-stage/usr/share/holonight-greeter/backgrounds/wallpaper.png
              test "$(find /tmp/holonight-greeter-stage/usr/share/pixmaps/faces -type f | wc -l)" -eq 8
              test -f /tmp/holonight-greeter-stage/usr/lib/tmpfiles.d/holonight-greeter.conf
              test -f /tmp/holonight-greeter-stage/usr/share/doc/holonight-greeter/greetd-config.toml
              test -f /tmp/holonight-greeter-stage/usr/share/doc/holonight-greeter/CAGE.md
              test -x /tmp/holonight-greeter-stage/usr/libexec/holonight-greeter/holonight-greeter-cage-diagnostic
              test ! -e /tmp/holonight-greeter-stage/etc/greetd/config.toml
              test ! -e /etc/greetd/config.toml
            '
